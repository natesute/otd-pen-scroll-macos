name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet publish src/PenScroll/PenScroll.csproj -c Release -o publish
      - name: Package
        run: |
          zip -j PenScroll.zip publish/PenScroll.dll LICENSE
          sha256sum PenScroll.zip | tee PenScroll.zip.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: PenScroll
          path: |
            PenScroll.zip
            PenScroll.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: PenScroll
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PenScroll.zip
            PenScroll.zip.sha256
          generate_release_notes: true
